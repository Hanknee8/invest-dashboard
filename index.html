<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>QClaw 投资看板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0e17;--card:#111827;--border:#1e2a3a;--text:#e1e5ee;--dim:#6b7a90;--green:#22c55e;--yellow:#eab308;--red:#ef4444;--blue:#3b82f6;--purple:#8b5cf6;--orange:#f97316}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);padding:12px;max-width:800px;margin:0 auto;-webkit-font-smoothing:antialiased}
.header{text-align:center;padding:16px 0 8px;border-bottom:1px solid var(--border);margin-bottom:12px}
.header h1{font-size:20px;background:linear-gradient(135deg,var(--blue),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header .sub{font-size:11px;color:var(--dim);margin-top:2px}
.header .refresh{font-size:10px;color:var(--dim);margin-top:4px;opacity:0.7}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--blue),var(--purple))}
.ct{font-size:12px;color:var(--dim);margin-bottom:8px;display:flex;align-items:center;gap:4px}
.score-center{text-align:center;padding:6px 0}
.score-num{font-size:56px;font-weight:800;line-height:1}
.score-of{font-size:14px;color:var(--dim)}
.score-eff{font-size:13px;color:#94a3b8;margin-top:4px}
.score-bar{display:flex;justify-content:center;gap:3px;margin-top:10px}
.sb{width:24px;height:7px;border-radius:4px;background:var(--border)}
.sb.g{background:var(--green)}.sb.y{background:var(--yellow)}.sb.r{background:var(--red)}
.score-act{margin-top:8px;font-size:12px;font-weight:600;padding:4px 12px;border-radius:6px;display:inline-block}
.act-g{background:#22c55e20;color:var(--green)}.act-y{background:#eab30820;color:var(--yellow)}.act-r{background:#ef444420;color:var(--red)}
.dr{display:flex;align-items:center;padding:5px 0;border-bottom:1px solid #ffffff06}
.dr:last-child{border:none}
.dn{font-size:12px;color:#94a3b8;width:60px;flex-shrink:0}
.db{flex:1;height:5px;background:var(--border);border-radius:3px;margin:0 8px;overflow:hidden}
.df{height:100%;border-radius:3px}
.dv{font-size:12px;font-weight:700;width:32px;text-align:right;flex-shrink:0}
.chart-svg{width:100%;height:160px}
.cr{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px}
.ci{font-size:14px;width:20px;text-align:center;flex-shrink:0}
.cx{flex:1;color:#94a3b8}
.cs{font-size:11px;font-weight:600;padding:1px 6px;border-radius:3px;flex-shrink:0}
.p{background:#22c55e20;color:var(--green)}.f{background:#ef444420;color:var(--red)}.w{background:#eab30820;color:var(--yellow)}
.vr{display:flex;align-items:center;padding:6px 0;border-bottom:1px solid #ffffff06}
.vr:last-child{border:none}
.vs{font-size:12px;font-weight:600;width:52px}
.vp{font-size:13px;font-weight:700;width:44px}
.vb{flex:1;height:6px;background:var(--border);border-radius:3px;margin:0 8px;overflow:hidden}
.vf{height:100%;border-radius:3px}
.vst{font-size:11px;font-weight:600;padding:1px 6px;border-radius:3px}
.cash{text-align:center;padding:8px 0}
.cash-n{font-size:32px;font-weight:800;color:var(--blue)}
.cash-l{font-size:11px;color:var(--dim);margin-top:2px}
.cash-row{display:flex;justify-content:center;gap:16px;margin-top:10px}
.cash-item{text-align:center}
.cash-v{font-size:16px;font-weight:700}
.cash-il{font-size:10px;color:var(--dim);margin-top:1px}
.cl{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:12px;border-bottom:1px solid #ffffff06}
.cl:last-child{border:none}
.cl-s{color:#94a3b8;flex:1}
.cl-d{font-weight:600;flex-shrink:0;margin-left:8px}
.cl-ok{color:var(--green)}.cl-w{color:var(--orange)}
.tr{display:flex;gap:6px;padding:4px 0;font-size:11px;align-items:center;border-bottom:1px solid #ffffff06}
.tr:last-child{border:none}
.tr-a{font-weight:600;min-width:28px}
.tr-sell{color:var(--red)}.tr-buy{color:var(--green)}
.tr-f{color:var(--text);flex:1}
.tr-m{color:#94a3b8;min-width:48px;text-align:right}
.tr-pl{min-width:48px;text-align:right;font-weight:600}
.dt{display:flex;gap:8px;padding:3px 0;font-size:12px;border-bottom:1px solid #ffffff06}
.dt:last-child{border:none}
.dt-d{color:var(--blue);font-weight:700;min-width:44px}
.dt-e{color:#94a3b8}
.loading{text-align:center;padding:60px 0;color:var(--dim);font-size:14px}
.error-card{background:#ef444415;border-color:#ef444440}
</style>
</head>
<body>
<div class="header">
  <h1>📊 QClaw 投资看板</h1>
  <div class="sub" id="ut">加载中...</div>
  <div class="refresh" id="rf"></div>
</div>

<div id="app"><div class="loading">⏳ 正在加载数据...</div></div>

<script>
// Data URL - auto-refreshes from GitHub repo
const DATA_URL = './data.json';
const STATE_URL = './state.json';
const HISTORY_URL = './history.json';
const REFRESH_MIN = 5;

function $(s,p){return(p||document).querySelector(s)}
function $$(s,p){return[...(p||document).querySelectorAll(s)]}

// Fetch with cache-bust
async function fetchData(url) {
  const sep = url.includes('?') ? '&' : '?';
  const r = await fetch(url + sep + '_t=' + Date.now());
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

// Parse state.md text into structured data
function parseState(t) {
  const d = {cash:0,total:0,safety:9000,avail:0,cooling:[],reentry:[],val:[],trades:[],dates:[]};
  const m = t.match(/现金[：:]\s*~?(\d+)/); if(m) d.cash = +m[1];
  const m2 = t.match(/总资产[：:]\s*~?(\d+)/); if(m2) d.total = +m2[1];
  const m3 = t.match(/可动用[：:]\s*~?(\d+)/); if(m3) d.avail = +m3[1];
  const m4 = t.match(/安全线[：:]\s*(\d+)/); if(m4) d.safety = +m4[1];

  const re = t.match(/## 再入场条件[\s\S]*?(?=\n---|\n##|$)/);
  if(re){const rows=[...re[0].matchAll(/\|\s*(\d+)\s*\|\s*([^|]+)\|\s*([^|]+)\|/g)];
    for(const r of rows){if(!r[2].includes('条件')){let s='f';if(r[3].includes('✅'))s='p';else if(r[3].includes('🟡'))s='w';
    d.reentry.push({n:r[1],c:r[2].trim(),s,raw:r[3].trim()})}}}

  const vl = t.match(/## 估值水位[\s\S]*?(?=\n---|\n##|$)/);
  if(vl){const rows=[...vl[0].matchAll(/\|\s*([^|\n]+)\|\s*([^|\n]+)\|\s*([^|\n]+)\|/g)];
    for(const r of rows){if(!r[1].includes('板块'))d.val.push({s:r[1].trim(),p:r[2].trim(),st:r[3].trim()})}}

  const cl = t.match(/## 🚫 冷却期[\s\S]*?(?=\n---|\n##|$)/);
  if(cl){const rows=[...cl[0].matchAll(/\|\s*([^|]+)\|\s*([^|]+)\|\s*([^|]+)\|\s*([^|]+)\|\s*([^|]+)\|\s*([^|]+)\|/g)];
    for(const r of rows){const f=r[1].trim();if(f&&!f.startsWith('基金'))
    d.cooling.push({f,c:r[2].trim(),sec:r[3].trim(),sd:r[4].trim(),tp:r[5].trim(),td:r[6].trim()})}}

  const tr = t.match(/## 操作记录[\s\S]*?(?=\n---|\n##|$)/);
  if(tr){const rows=[...tr[0].matchAll(/\|\s*([^|]+)\|\s*([^|]+)\|\s*([^|]+)\|\s*([^|]+)\|\s*([^|]+)\|\s*([^|]+)\|\s*([^|]+)\|/g)];
    for(const r of rows){const dt=r[1].trim();if(dt&&!dt.startsWith('日期'))
    d.trades.push({dt,a:r[2].trim(),f:r[3].trim(),c:r[4].trim(),m:r[5].trim(),pl:r[6].trim()})}}

  const kd = t.match(/## 关键日期([\s\S]*?)$/);
  if(kd){const rows=[...kd[1].matchAll(/\|\s*([^|]+)\|\s*([^|]+)\|/g)];
    for(const r of rows){const dd=r[1].trim();if(dd&&!dd.startsWith('日期'))d.dates.push({d:dd,e:r[2].trim()})}}

  return d;
}

function scColor(v){return v>=6?'var(--green)':v>=4?'var(--yellow)':'var(--red)'}

function buildHTML(C, H, SD) {
  const sc = C.score || 0, ef = C.effective_score || 0;
  let html = '';

  // Score Card
  html += `<div class="card"><div class="ct">🎯 主线健康度</div>
<div class="score-center">
<div class="score-num" style="color:${scColor(sc)}">${sc.toFixed(1)}</div>
<div class="score-of">/10</div>
<div class="score-eff">有效评分 ${ef.toFixed(2)}（2天均值）</div>
<div class="score-bar">`;
  for(let i=0;i<10;i++){const c=i<sc?(sc>=6?'g':sc>=4?'y':'r'):'';html+=`<div class="sb ${c}"></div>`;}
  html += `</div><div class="score-act ${sc>=6?'act-g':sc>=4?'act-y':'act-r'}">${sc>=6?'🟢 可入场':sc>=4?'🟡 震荡观察':'🔴 减仓/清仓'}</div></div></div>`;

  // Dimensions
  const dims = C.dimensions || {};
  const dimOrder = ['资金流向','龙头位置','政策催化','板块趋势','成交量'];
  html += `<div class="card"><div class="ct">📐 评分维度</div>`;
  for(const name of dimOrder){
    const d=dims[name];const v=d?d.score:0;const mx=d?d.max:2;const pct=Math.round(v/mx*100);
    const cl=v/mx>=0.6?'var(--green)':v/mx>=0.3?'var(--yellow)':'var(--red)';
    html+=`<div class="dr"><div class="dn">${name}</div><div class="db"><div class="df" style="width:${pct}%;background:${cl}"></div></div><div class="dv" style="color:${cl}">${v}/${mx}</div></div>`;
  }
  html += `</div>`;

  // Score Chart
  if(H && H.length > 0) {
    const dailyMap = {};
    for(const h of H){if(!dailyMap[h.date]||h.time>=(dailyMap[h.date].time||''))dailyMap[h.date]=h;}
    const entries = Object.entries(dailyMap).sort((a,b)=>a[0].localeCompare(b[0]));
    if(entries.length > 0) {
      const labels=entries.map(e=>e[0].slice(5));
      const scores=entries.map(e=>e[1].score);
      const effs=entries.map(e=>e[1].effective_score||e[1].score);
      const W=320,H2=130,P=30,PB=20;
      const xScale=(i)=>P+i*(W-2*P)/(labels.length-1||1);
      const yScale=(v)=>H2-PB-v/10*(H2-P-PB);
      function makeLine(data,color){let pts=data.map((v,i)=>`${xScale(i)},${yScale(v)}`).join(' ');return `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>`;}
      function makeDots(data,color){return data.map((v,i)=>`<circle cx="${xScale(i)}" cy="${yScale(v)}" r="3" fill="${color}"/>`).join('');}
      const y5=yScale(5),y3=yScale(3);
      html+=`<div class="card"><div class="ct">📈 评分趋势</div>
      <svg viewBox="0 0 ${W} ${H2}" class="chart-svg" preserveAspectRatio="xMidYMid meet">
      <line x1="${P}" y1="${y5}" x2="${W-P}" y2="${y5}" stroke="#22c55e40" stroke-dasharray="4 3"/><text x="${W-P+2}" y="${y5+3}" fill="#22c55e80" font-size="8">5</text>
      <line x1="${P}" y1="${y3}" x2="${W-P}" y2="${y3}" stroke="#ef444440" stroke-dasharray="4 3"/><text x="${W-P+2}" y="${y3+3}" fill="#ef444480" font-size="8">3</text>
      ${makeLine(effs,'#f59e0b')}${makeDots(effs,'#f59e0b')}
      ${makeLine(scores,'#8b5cf6')}${makeDots(scores,'#8b5cf6')}
      ${labels.map((l,i)=>`<text x="${xScale(i)}" y="${H2-4}" fill="#6b7a90" font-size="7" text-anchor="middle">${l}</text>`).join('')}
      </svg>
      <div style="display:flex;justify-content:center;gap:12px;margin-top:4px;font-size:10px;color:#6b7a90">
      <span style="color:#f59e0b">● 有效评分</span><span style="color:#8b5cf6">● 评分</span><span style="color:#22c55e80">--- 买入线</span><span style="color:#ef444480">--- 危险线</span>
      </div></div>`;
    }
  }

  // Re-entry
  if(SD && SD.reentry && SD.reentry.length > 0) {
    html += `<div class="card"><div class="ct">🚦 再入场条件</div>`;
    for(const r of SD.reentry){
      const icon=r.s==='p'?'✅':r.s==='w'?'🟡':'❌';
      const cls=r.s==='p'?'p':r.s==='w'?'w':'f';
      const stxt=r.raw.replace(/[✅❌🟡⛔]/g,'').trim();
      html+=`<div class="cr"><div class="ci">${icon}</div><div class="cx">${r.c}</div><div class="cs ${cls}">${stxt}</div></div>`;
    }
    html += `</div>`;
  }

  // Valuation
  if(SD && SD.val && SD.val.length > 0) {
    html += `<div class="card"><div class="ct">📐 估值水位</div>`;
    for(const v of SD.val){
      const pn=parseInt(v.p.replace(/[^0-9]/g,''))||0;
      const cl=pn>90?'var(--red)':pn>80?'var(--orange)':'var(--green)';
      const cls=pn>90?'f':pn>80?'w':'p';
      const stx=v.st.replace(/[⛔⚠️✅]/g,'').trim()||(pn>90?'禁止买入':pn>80?'不加仓':'可买');
      html+=`<div class="vr"><div class="vs" style="color:var(--text)">${v.s}</div><div class="vp" style="color:${cl}">${v.p}</div><div class="vb"><div class="vf" style="width:${Math.min(pn,100)}%;background:${cl}"></div></div><div class="vst ${cls}">${stx}</div></div>`;
    }
    html += `</div>`;
  }

  // Cash
  if(SD) {
    html += `<div class="card"><div class="ct">💰 账户概览</div>
<div class="cash"><div class="cash-n">${SD.total.toLocaleString()}</div><div class="cash-l">总资产（元）</div>
<div class="cash-row">
<div class="cash-item"><div class="cash-v">${SD.cash.toLocaleString()}</div><div class="cash-il">现金</div></div>
<div class="cash-item"><div class="cash-v">${SD.avail.toLocaleString()}</div><div class="cash-il">可动用</div></div>
<div class="cash-item"><div class="cash-v" style="color:var(--green)">${SD.safety.toLocaleString()}</div><div class="cash-il">安全线</div></div>
</div></div></div>`;
  }

  // Cooling
  if(SD && SD.cooling) {
    html += `<div class="card"><div class="ct">🚫 冷却期</div>`;
    let coolHTML = '';
    for(const c of SD.cooling){
      if(!c.td||c.td==='—')continue;
      coolHTML+=`<div class="cl"><div class="cl-s">${c.c} ${c.f}</div><div class="cl-d cl-w">${c.td}</div></div>`;
    }
    html += coolHTML || '<div style="color:var(--dim);text-align:center;padding:12px;font-size:12px">无冷却期</div>';
    html += `</div>`;
  }

  // Trades
  if(SD && SD.trades && SD.trades.length > 0) {
    html += `<div class="card"><div class="ct">📋 近期操作</div>`;
    for(const t of SD.trades){
      const isBuy=t.a.includes('买');
      const plcls=t.pl.includes('+')?'var(--green)':t.pl.includes('-')?'var(--red)':'var(--dim)';
      html+=`<div class="tr"><div class="tr-a ${isBuy?'tr-buy':'tr-sell'}">${isBuy?'买入':'卖出'}</div><div class="tr-f">${t.f}</div><div class="tr-m">${t.m}</div><div class="tr-pl" style="color:${plcls}">${t.pl}</div></div>`;
    }
    html += `</div>`;
  }

  // Key Dates
  if(SD && SD.dates && SD.dates.length > 0) {
    html += `<div class="card"><div class="ct">📅 关键日期</div>`;
    for(const d of SD.dates){
      html+=`<div class="dt"><div class="dt-d">${d.d}</div><div class="dt-e">${d.e}</div></div>`;
    }
    html += `</div>`;
  }

  return html;
}

// Main
async function main() {
  try {
    const [C, H, stateRaw] = await Promise.all([
      fetchData(DATA_URL),
      fetchData(HISTORY_URL).catch(()=>[]),
      fetchData(STATE_URL).catch(()=>null)
    ]);

    let SD = null;
    if(stateRaw && stateRaw.text) {
      SD = parseState(stateRaw.text);
    }

    const html = buildHTML(C, H, SD);
    $('#app').innerHTML = html;

    // Update header
    const ts = C.cache_timestamp || C.date || '';
    $('#ut').textContent = `${C.date||''} ${C.time||''} | v${C.version||'?'}`;
    
    const now = new Date();
    $('#rf').textContent = `🔄 ${REFRESH_MIN}分钟自动刷新 | 上次加载: ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;

  } catch(e) {
    $('#app').innerHTML = `<div class="card error-card"><div class="ct">⚠️ 加载失败</div><div style="color:var(--red);font-size:13px;padding:12px">${e.message}<br><br>请稍后刷新重试</div></div>`;
  }
}

main();

// Auto-refresh
setInterval(main, REFRESH_MIN * 60 * 1000);
</script>
</body>
</html>
