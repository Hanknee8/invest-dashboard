<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0e17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>QClaw 交易链</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0e17;--card:#111827;--card2:#151d2e;--border:#1e2a3a;
  --text:#e1e5ee;--dim:#6b7a90;--dimmer:#3d4a5c;
  --red:#ef4444;--red20:#ef444420;--red40:#ef444466;
  --green:#22c55e;--green20:#22c55e20;--green40:#22c55e66;
  --yellow:#eab308;--yellow20:#eab30820;
  --blue:#3b82f6;--blue20:#3b82f620;--purple:#8b5cf6;--purple20:#8b5cf620;
  --orange:#f97316;--cyan:#06b6d4;
  --radius:12px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);max-width:560px;margin:0 auto;padding:0 0 70px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
.page{display:none;padding:14px}
.page.active{display:block;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* header */
.topbar{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,var(--bg),var(--bg) 80%,transparent);padding:14px 14px 8px;display:flex;justify-content:space-between;align-items:center}
.topbar h1{font-size:19px;font-weight:800;background:linear-gradient(135deg,var(--blue),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.topbar .sub{font-size:10px;color:var(--dim)}
.topbar .refresh{font-size:12px;color:var(--blue);cursor:pointer;border:1px solid var(--border);padding:4px 10px;border-radius:16px;background:var(--card)}

/* cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--blue),var(--purple))}
.ct{font-size:11px;color:var(--dim);margin-bottom:10px;display:flex;align-items:center;gap:5px;font-weight:600;letter-spacing:.5px}

/* signal light */
.signal{text-align:center;padding:18px 12px}
.signal-light{font-size:56px;line-height:1;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.65}}
.signal-text{font-size:22px;font-weight:800;margin-top:8px}
.signal-reason{font-size:12px;color:var(--dim);margin-top:6px}
.signal.s-buy .signal-light,.signal.s-buy .signal-text{color:var(--red)}
.signal.s-check .signal-light,.signal.s-check .signal-text{color:var(--yellow)}
.signal.s-sell .signal-light,.signal.s-check .signal-light{color:var(--green)}
.signal.s-buy{background:linear-gradient(180deg,var(--red20),transparent)}
.signal.s-check{background:linear-gradient(180deg,var(--yellow20),transparent)}

/* account grid */
.acc-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}
.acc-item{padding:10px 4px;border-radius:8px;background:var(--card2)}
.acc-v{font-size:19px;font-weight:800}
.acc-l{font-size:10px;color:var(--dim);margin-top:2px}
.acc-bar{margin-top:12px}
.acc-bar-row{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:11px}
.acc-bar-label{width:52px;color:var(--dim);flex-shrink:0}
.acc-bar-track{flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.acc-bar-fill{height:100%;border-radius:4px;transition:width .6s}
.acc-bar-val{width:56px;text-align:right;font-weight:700;font-size:11px}

/* thermo */
.thermo{display:flex;align-items:center;gap:10px;padding:5px 0}
.thermo-label{font-size:11px;font-weight:600;width:66px;flex-shrink:0}
.thermo-bar{flex:1;height:12px;border-radius:6px;background:var(--border);position:relative;overflow:hidden}
.thermo-fill{position:absolute;top:0;bottom:0;left:0;border-radius:6px;transition:width .6s}
.thermo-pct{font-size:13px;font-weight:800;width:42px;text-align:right;flex-shrink:0}
.thermo-note{font-size:9px;color:var(--dim);width:46px;text-align:right;flex-shrink:0}

/* position table */
.pos-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border);cursor:pointer}
.pos-row:last-child{border-bottom:none}
.pos-main{flex:1;min-width:0}
.pos-name{font-size:13px;font-weight:700}
.pos-sub{font-size:10px;color:var(--dim);margin-top:2px}
.pos-right{text-align:right;flex-shrink:0}
.pos-pnl{font-size:15px;font-weight:800}
.pos-amt{font-size:10px;color:var(--dim)}
.pos-expand{max-height:0;overflow:hidden;transition:max-height .3s}
.pos-expand.open{max-height:300px}
.pos-detail{padding:10px;background:var(--card2);border-radius:8px;font-size:11px;line-height:1.7;margin-bottom:4px}
.pos-detail b{color:var(--blue)}

/* dims */
.dim-row{margin-bottom:10px}
.dim-head{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
.dim-name{font-weight:600}
.dim-score{font-weight:800}
.dim-bar{height:7px;background:var(--border);border-radius:4px;overflow:hidden}
.dim-fill{height:100%;border-radius:4px}
.dim-reason{font-size:10px;color:var(--dim);margin-top:3px}

/* sector scores */
.sec-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sec-box{padding:8px 4px;border-radius:8px;text-align:center;background:var(--card2)}
.sec-id{font-size:12px;font-weight:800}
.sec-score{font-size:16px;font-weight:800;margin-top:2px}
.sec-name{font-size:8px;color:var(--dim);margin-top:2px}

/* svg chart */
.chart-wrap{width:100%;overflow-x:auto}
.chart-wrap svg{display:block;margin:0 auto}

/* path */
.path-item{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;background:var(--card2);margin-bottom:6px}
.path-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;border:2px solid var(--border)}
.path-dot.pass{background:var(--green);border-color:var(--green)}
.path-dot.near{background:var(--yellow);border-color:var(--yellow)}
.path-dot.fail{background:var(--dimmer);border-color:var(--dimmer)}
.path-info{flex:1;min-width:0}
.path-name{font-size:12px;font-weight:700}
.path-hint{font-size:10px;color:var(--dim)}
.path-meta{font-size:10px;font-weight:700;flex-shrink:0}

/* checklist */
.chk-item{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:12px;border-bottom:1px solid var(--border)}
.chk-item:last-child{border-bottom:none}
.chk-num{width:20px;height:20px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;color:var(--dim)}

/* rules */
.rule-item{padding:8px 0;border-bottom:1px solid var(--border)}
.rule-item:last-child{border-bottom:none}
.rule-name{font-size:13px;font-weight:700;color:var(--red)}
.rule-desc{font-size:11px;color:var(--text);margin-top:3px;line-height:1.6}

/* tree */
.tree{font-family:'Courier New',monospace;font-size:11px;line-height:1.7;color:var(--text);white-space:pre-wrap;background:var(--card2);border-radius:8px;padding:12px}

/* priority */
.prio{display:flex;flex-wrap:wrap;gap:4px}
.prio-tag{font-size:9px;padding:3px 8px;border-radius:10px;background:var(--card2);border:1px solid var(--border)}
.prio-tag.hot{background:var(--red20);border-color:var(--red40);color:var(--red)}

/* log */
.log-item{padding:9px 0;border-bottom:1px solid var(--border)}
.log-item:last-child{border-bottom:none}
.log-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.badge{font-size:9px;padding:2px 7px;border-radius:4px;font-weight:700}
.b-buy{background:var(--red20);color:var(--red)}
.b-sell{background:var(--green20);color:var(--green)}
.b-psell{background:var(--yellow20);color:var(--yellow)}
.b-miss{background:var(--card2);color:var(--dim)}
.log-code{font-size:13px;font-weight:800}
.log-trigger{font-size:11px;color:var(--dim);margin-top:3px}
.log-meta{font-size:10px;color:var(--dimmer);margin-top:2px}

/* exp card */
.ec-item{padding:10px;border-radius:8px;background:var(--card2);margin-bottom:8px}
.ec-head{font-size:12px;font-weight:700;margin-bottom:4px}
.ec-body{font-size:11px;color:var(--text);line-height:1.6}
.ec-tag{font-size:9px;padding:1px 6px;border-radius:8px;background:var(--blue20);color:var(--blue);margin-left:4px}

/* tabbar */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;display:flex;background:var(--card);border-top:1px solid var(--border);z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;text-align:center;padding:8px 0 6px;cursor:pointer;color:var(--dim);transition:color .15s}
.tab.active{color:var(--blue)}
.tab .ic{font-size:19px;display:block}
.tab .lb{font-size:9px;margin-top:1px}

.up{color:var(--red)}.down{color:var(--green)}.flat{color:var(--dim)}
.muted{color:var(--dim)}
.small{font-size:10px}
.bold{font-weight:700}
</style>
</head>

    return `<div style="display:flex;justify-content:space-between;padding:5px 0;font-size:12px;border-bottom:1px solid var(--border)">
      <span>${v.name||k}</span><span class="${pctCls(chg)} bold">${pct(chg)}</span></div>`;
  }).join('');
  document.getElementById('overseas').innerHTML = ovRows || '<span class="muted">无数据</span>';

  // push content
  document.getElementById('push-content').textContent = scan.pushContent || '无扫描数据';

  // === 持仓 ===
  const pos = st.positions || [];
  document.getElementById('pos-list').innerHTML = pos.length ? pos.map((p,i)=>`
    <div>
      <div class="pos-row" onclick="togglePos(${i})">
        <div class="pos-main">
          <div class="pos-name">${p.code} ${p.name||''}</div>
          <div class="pos-sub">${p.sector||''} · 买入净值 ${fmt(p.buyNav)} · 持有${p.holdDays??'—'}天</div>
        </div>
        <div class="pos-right">
          <div class="pos-pnl ${pctCls(p.pnlPct)}">${pct(p.pnlPct)}</div>
          <div class="pos-amt">${fmt(p.amount)}元</div>
        </div>
      </div>
      <div class="pos-expand" id="pos-exp-${i}">
        <div class="pos-detail">
          <b>止损价</b> ${p.stopLoss||'—'}<br>
          ${p.note||''}<br>
          买入日期：${p.buyDate||'—'}
        </div>
      </div>
    </div>`).join('') : '<span class="muted">无持仓</span>';

  document.getElementById('sell-priority').innerHTML = [
    '① 逻辑破坏 → 🔴全清立即下单',
    '② 止损触发 → 🔴全清',
    '③ 移动止损/阶梯止盈 → 按规则卖',
    '④ 估值>90% → 按档位止盈',
    '⑤ 仓位超限 → 卖超限部分',
    '⑥ 都没触发 → ✅持有不动'
  ].join('<br>');

  // === 评分 ===
  const dims = sc.dimensions || {};
  document.getElementById('score-total').textContent = `（${sc.score??'—'} / 8）`;
  document.getElementById('dims').innerHTML = Object.entries(dims).filter(([k])=>!k.startsWith('_')).map(([k,v])=>{
    const s = v.score??0, max = v.max??2;
    const ratio = max>0?(s/max*100):0;
    const color = ratio>=75?'var(--red)':(ratio>=50?'var(--yellow)':'var(--blue)');
    return `<div class="dim-row">
      <div class="dim-head"><span class="dim-name">${k}</span><span class="dim-score">${s}/${max}</span></div>
      <div class="dim-bar"><div class="dim-fill" style="width:${ratio}%;background:${color}"></div></div>
      <div class="dim-reason">${v.reason||''}</div></div>`;
  }).join('');

  const secScores = {S1a:sc.score_s1a,S1b:sc.score_s1b,S2:sc.score_s2,S3:sc.score_s3};
  document.getElementById('sec-scores').innerHTML = Object.entries(secScores).map(([k,v])=>{
    const color = v>=6?'var(--red)':(v>=4?'var(--yellow)':'var(--green)');
    return `<div class="sec-box"><div class="sec-id">${k}</div><div class="sec-score" style="color:${color}">${v??'—'}</div><div class="sec-name">${k==='S1a'?'设备':k==='S1b'?'设计':k==='S2'?'CPO':'算力'}</div></div>`;
  }).join('');

  const hist = sc.score_history_last5 || [];
  document.getElementById('score-trend').innerHTML = lineChart(hist.map(h=>({x:h.date,y:h.effective??h.score})), '评分', 0, 8);

  // === 估值 ===
  const val = sc.valuation || {};
  document.getElementById('val-thermo').innerHTML = Object.entries(val).map(([k,v])=>{
    const p = parseFloat(v['估值百分位']);
    const color = p>=90?'var(--red)':(p>=80?'var(--yellow)':'var(--green)');
    return `<div class="thermo">
      <span class="thermo-label">${k.replace('半导体','').replace('基础设施','').replace('/材料','').replace('/封测','')}</span>
      <div class="thermo-bar"><div class="thermo-fill" style="width:${p}%;background:${color}"></div></div>
      <span class="thermo-pct">${p.toFixed(0)}%</span>
      <span class="thermo-note">${v['校准状态']==='未校准'?'':v['校准状态'].replace('已校准','校准')}</span></div>`;
  }).join('');

  const vt = sc.valuation_trend || {};
  const vtDates = vt.dates || [];
  const vtSeries = ['S1a设备/材料','S1b设计/封测','S2_CPO通信','S3算力基础设施'].filter(k=>vt[k]).map(k=>({name:k,data:vt[k]}));
  document.getElementById('val-trend').innerHTML = multiLineChart(vtDates, vtSeries);

  document.getElementById('entry-paths').innerHTML = Object.entries(sc.entry_paths||{}).map(([k,v])=>
    `<div style="margin-bottom:6px"><b style="color:var(--blue)">${k}</b><br><span style="color:var(--dim)">${v}</span></div>`).join('');

  // === 路径 ===
  const nt = scan.nearTriggers || [];
  document.getElementById('near-triggers').innerHTML = nt.length ? nt.map(t=>{
    const cls = t.conditions_met===t.conditions_total?'pass':(t.conditions_met>0?'near':'fail');
    return `<div class="path-item">
      <div class="path-dot ${cls}"></div>
      <div class="path-info"><div class="path-name">路径${t.path} · ${t.sector||''}</div><div class="path-hint">${t.hint||''}</div></div>
      <div class="path-meta">${t.conditions_met}/${t.conditions_total}</div></div>`;
  }).join('') : '<span class="muted">无准触发信号</span>';

  document.getElementById('checklist').innerHTML = [
    '主线方向（S1a/S1b/S2/S3/S4）','代码验证','冷却期（按子赛道）','大盘（上证跌≤2%）',
    '现金（买后≥1000）','入场信号（路径A/F）','不追涨（子赛道涨<2%）','估值合理（按子赛道）'
  ].map((t,i)=>`<div class="chk-item"><span class="chk-num">${i+1}</span>${t}</div>`).join('');

  document.getElementById('cooldown').innerHTML = `<div style="font-size:13px">${st.cooldown||'无冷却期，所有赛道可操作'}</div>
    <div class="small muted" style="margin-top:6px">止盈→无冷却 | F止损→7天 | A/E止损→30天 | 主动清仓→无冷却</div>`;

  // === 铁律 ===
  const rules = [
    ['核1 保本','亏损不加仓（估值<60%+主线+评分≥7例外）'],
    ['核2 主线','只做半导体设备/材料(S1a)+设计/封测(S1b)+CPO(S2)+算力(S3)+电网(S4)'],
    ['核3 安全线','总资产<8500→清仓'],
    ['核4 永不满仓','现金≥1000元 + 同时持仓≤4个赛道'],
    ['核5 止损','双重止损=固定(估值分档-5%/-7%/-10%)+移动(F专属三档)+阴跌3天-7%'],
    ['核6 cron优先','14:40推送为最终依据，主session不得override']
  ];
  document.getElementById('core-rules').innerHTML = rules.map(r=>`<div class="rule-item"><div class="rule-name">${r[0]}</div><div class="rule-desc">${r[1]}</div></div>`).join('');

  const prio = ['安全线','止损','cron优先','黑天鹅','大盘','地缘','月度止损','永不满仓','止盈','冷却期'];
  document.getElementById('priority').innerHTML = prio.map((p,i)=>`<span class="prio-tag ${i<3?'hot':''}">${i+1}.${p}</span>`).join('');

  document.getElementById('tree').textContent = [
    '1. 总资产<8500? → 清仓',
    '2. 上月亏损>5%? → 前5交易日禁新建仓',
    '3. 上证跌>2%? → 禁买 | >3%减仓 | >5%等反弹',
    '4. 地缘触发? → 减半+3天观察',
    '5. 持仓单日跌>5%? → 5-8%警惕/8-12%卖1/3/>12%卖半仓',
    '6. 浮亏>止损线? → 非主线即卖/主线+评分≥4观察1天',
    '7. 浮盈5%/8%? → 止盈(半仓/清仓)',
    '8. 现金<1000? → 禁买',
    '9. 14:40已推送? → 以cron结论为准',
    '10. 买入检查: F(连涨≥2天+涨<5%+大盘未跌>2%) > A(连跌≥2天+估值<90%)',
    '11. 无触发 → 持有观望'
  ].join('\n');

  // === 日志 ===
  const trades = D.trades || [];
  document.getElementById('trade-log').innerHTML = trades.length ? trades.map(t=>{
    const bm = {buy:['b-buy','买入'],sell:['b-sell','卖出'],partial_sell:['b-psell','半仓卖出'],miss:['b-miss','踏空']};
    const b = bm[t.action]||['b-miss',t.action];
    const pnl = t.profit_pct!=null?`（${pct(t.profit_pct)}）`:'';
    return `<div class="log-item">
      <div class="log-head"><span class="badge ${b[0]}">${b[1]}</span><span class="log-code">${t.fund_code||''}</span><span class="small muted">${t.fund_name||''}</span></div>
      <div class="log-trigger">${t.trigger||''}</div>
      <div class="log-meta">${t.date||''} · ${t.amount!=null?fmt(t.amount)+'元':''} ${pnl}</div></div>`;
  }).join('') : '<span class="muted">无记录</span>';

  const ecs = D.expCards || [];
  document.getElementById('exp-cards').innerHTML = ecs.length ? ecs.map(e=>`
    <div class="ec-item"><div class="ec-head">${e.id}<span class="ec-tag">${e.cat}</span></div>
    <div class="ec-body">${e.body}</div></div>`).join('') : '<span class="muted">无经验卡片</span>';
}

function togglePos(i){
  const el = document.getElementById('pos-exp-'+i);
  if(el) el.classList.toggle('open');
}

function lineChart(points, label, min, max){
  if(!points.length) return '<span class="muted">无数据</span>';
  const W=320,H=140,P=24;
  const xs = points.map((p,i)=>P+i*(W-2*P)/(points.length-1||1));
  const ys = points.map(p=>{const v=Math.min(Math.max(p.y,min),max);return H-P-(v-min)/(max-min)*(H-2*P);});
  const pts = xs.map((x,i)=>`${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' ');
  const labels = points.map((p,i)=>`<text x="${xs[i]}" y="${H-6}" font-size="8" fill="var(--dim)" text-anchor="middle">${(p.x||'').slice(5)}</text>`).join('');
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    ${[min,(min+max)/2,max].map(v=>`<line x1="${P}" x2="${W-P}" y1="${H-P-(v-min)/(max-min)*(H-2*P)}" y2="${H-P-(v-min)/(max-min)*(H-2*P)}" stroke="var(--border)" stroke-width="0.5"/><text x="2" y="${H-P-(v-min)/(max-min)*(H-2*P)+3}" font-size="8" fill="var(--dimmer)">${v}</text>`).join('')}
    <polyline points="${pts}" fill="none" stroke="var(--blue)" stroke-width="2"/>
    ${points.map((p,i)=>`<circle cx="${xs[i]}" cy="${ys[i]}" r="3" fill="var(--blue)"/>`).join('')}
    ${labels}</svg>`;
}

function multiLineChart(dates, series){
  if(!dates.length || !series.length) return '<span class="muted">无数据</span>';
  const W=320,H=160,P=24;
  const colors = ['var(--blue)','var(--purple)','var(--cyan)','var(--orange)'];
  const allVals = series.flatMap(s=>s.data).filter(v=>v!=null);
  const min = Math.floor(Math.min(...allVals)/10)*10;
  const max = Math.ceil(Math.max(...allVals)/10)*10;
  const xs = dates.map((d,i)=>P+i*(W-2*P)/(dates.length-1||1));
  const yOf = v => H-P-(v-min)/(max-min)*(H-2*P);
  const lines = series.map((s,si)=>{
    const pts = s.data.map((v,i)=>v==null?null:`${xs[i].toFixed(1)},${yOf(v).toFixed(1)}`).filter(x=>x);
    return `<polyline points="${pts.join(' ')}" fill="none" stroke="${colors[si%4]}" stroke-width="1.8"/>` +
      s.data.map((v,i)=>v==null?'':`<circle cx="${xs[i]}" cy="${yOf(v)}" r="2.5" fill="${colors[si%4]}"/>`).join('');
  }).join('');
  const legend = series.map((s,si)=>`<span style="color:${colors[si%4]};font-size:9px;margin-right:8px">● ${s.name.replace('基础设施','').replace('/材料','').replace('/封测','').replace('通信','')}</span>`).join('');
  const labels = dates.map((d,i)=>`<text x="${xs[i]}" y="${H-6}" font-size="8" fill="var(--dim)" text-anchor="middle">${d.slice(5)}</text>`).join('');
  return `<div style="font-size:10px;margin-bottom:4px">${legend}</div>
    <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    ${[min,(min+max)/2,max].map(v=>`<line x1="${P}" x2="${W-P}" y1="${yOf(v)}" y2="${yOf(v)}" stroke="var(--border)" stroke-width="0.5"/><text x="2" y="${yOf(v)+3}" font-size="8" fill="var(--dimmer)">${v}</text>`).join('')}
    ${lines}${labels}</svg>`;
}

render();
</script>
</body>
</html>
