  table{width:100%;border-collapse:collapse;font-size:12.5px;}

  .val{font-size:11px;color:var(--mut);}
  .val b{color:var(--txt);font-weight:600;}
  .cooldown{font-size:12px;color:var(--mut);}
  .trades .t{padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
  .trades .t:last-child{border-bottom:none;}
  .t .d{color:var(--mut);font-size:11px;}
  .badge{font-size:10px;padding:1px 6px;border-radius:4px;margin-right:4px;}
  .b-buy{background:#0e2a1e;color:var(--green);}
  .b-sell{background:#2a0e14;color:var(--red);}
  .b-miss{background:#2a240e;color:var(--gold);}
  .muted{color:var(--mut);}
  .refresh{background:var(--blue);color:#fff;border:none;padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;}
  .refresh:active{opacity:.8;}
  .err{background:#2a0e14;border:1px solid #5a1f2a;color:#ff8a96;padding:12px;border-radius:12px;font-size:13px;margin-bottom:12px;display:none;}
  .push{white-space:pre-wrap;font-size:12.5px;background:#0d1526;border-radius:8px;padding:10px;color:#c9d4e8;}
  .total-row{font-size:14px;font-weight:700;margin-top:4px;}
</style>

<body>
  <div class="head">
    <h1>📊 QClaw 交易看板</h1>
    <button class="refresh" onclick="load()">刷新</button>
  </div>
  <div class="time" id="upd">加载中…</div>
  <div class="err" id="err"></div>

  <div class="card">
    <div class="grid">
      <div class="stat"><div class="v" id="s-cash">—</div><div class="l">现金</div></div>
      <div class="stat"><div class="v" id="s-pos">—</div><div class="l">持仓市值</div></div>
      <div class="stat"><div class="v" id="s-total">—</div><div class="l">总资产</div></div>
    </div>
    <div style="margin-top:10px;font-size:11px;color:var(--mut);">
      安全线 <b id="s-safety">—</b> ｜ 可动用 <b id="s-usable">—</b>
      <span id="s-cooldown" class="cooldown"></span>
    </div>
  </div>

  <div class="card">
    <div class="sect">持仓</div>
    <div id="pos-list"><span class="muted">加载中…</span></div>
  </div>

  <div class="card">
    <div class="sect">估值分位</div>
    <div id="val-list"><span class="muted">加载中…</span></div>
  </div>

  <div class="card">
    <div class="sect">最近交易</div>
    <div id="trade-list" class="trades"><span class="muted">加载中…</span></div>
  </div>

  <div class="card" id="push-card" style="display:none;">
    <div class="sect">今日扫描</div>
    <div class="push" id="push-text"></div>
  </div>

<script>
const fmt = n => (n === null || n === undefined || isNaN(n)) ? '—' : Number(n).toFixed(2);
const pct = v => (v === null || v === undefined || v === '' || isNaN(v)) ? '—' : (Number(v)>0?'+':'') + Number(v).toFixed(2) + '%';

function load() {
  if (window.__DATA) { render(window.__DATA); return; }
  const err = document.getElementById('err');
  err.style.display = 'none';
  fetch('/api/state', {cache:'no-store'})
    .then(r => r.json())
    .then(d => render(d))
    .catch(e => {
      err.textContent = '无法连接服务（' + e.message + '）';
      err.style.display = 'block';
    });
}

function render(d) {
  const s = d.state || {};
  document.getElementById('upd').textContent = '数据生成：' + (s.generatedAt || '—') + ' ｜ 服务：' + new Date(d.serverTime).toLocaleString('zh-CN');
  document.getElementById('s-cash').textContent = fmt(s.cash);
  document.getElementById('s-pos').textContent = fmt(s.position);
  document.getElementById('s-total').textContent = fmt(s.total);
  document.getElementById('s-safety').textContent = fmt(s.safety);
  document.getElementById('s-usable').textContent = fmt(s.usable);
  document.getElementById('s-cooldown').textContent = s.cooldown && s.cooldown !== '无' ? '｜ 冷却：' + s.cooldown : '';

  // 持仓
  const pos = s.positions || [];
  if (!pos.length) {
    document.getElementById('pos-list').innerHTML = '<span class="muted">无持仓</span>';
  } else {
    let h = '<table><tr><th>代码</th><th>名称/赛道</th><th>浮盈亏</th><th>止损</th></tr>';
    for (const p of pos) {
      const cls = Number(p.pnlPct) >= 0 ? 'up' : 'down';
      h += `<tr><td class="name">${p.code}</td>` +
           `<td>${p.name}<div class="val">${p.sector} · ${p.amount}元</div></td>` +
           `<td class="${cls}">${pct(p.pnlPct)}</td>` +
           `<td class="val"><b>${p.stopLoss || '—'}</b></td></tr>`;
    }
    h += '</table>';
    document.getElementById('pos-list').innerHTML = h;
  }

  // 估值
  const val = s.valuation || {};
  const vk = Object.keys(val);
  if (!vk.length) {
    document.getElementById('val-list').innerHTML = '<span class="muted">无数据</span>';
  } else {
    document.getElementById('val-list').innerHTML = vk.map(k =>
      `<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12.5px;border-bottom:1px solid var(--line);">
        <span>${k}</span><span class="val">${val[k].toFixed(1)}%</span>
      </div>`).join('');
  }

  // 交易
  const tr = d.trades || [];
  if (!tr.length) {
    document.getElementById('trade-list').innerHTML = '<span class="muted">无记录</span>';
  } else {
    const badge = a => a==='buy'?'b-buy':(a==='miss'?'b-miss':'b-sell');
    const actName = a => a==='buy'?'买入':(a==='miss'?'踏空':(a==='partial_sell'?'半仓卖出':'卖出'));
    document.getElementById('trade-list').innerHTML = tr.map(t => {
      const amt = t.amount != null ? t.amount + '元' : '';
      const pnl = t.profit_pct != null ? `（${pct(t.profit_pct)}）` : '';
      return `<div class="t">
        <span class="badge ${badge(t.action)}">${actName(t.action)}</span>
        <b>${t.fund_code || ''}</b> ${t.fund_name || ''} <span class="muted">${amt}${pnl}</span>
        <div class="d">${t.date || ''} · ${t.trigger || ''}</div>
      </div>`;
    }).join('');
  }

  // 今日扫描
  const scan = d.scan;
  if (scan && scan.pushContent) {
    document.getElementById('push-card').style.display = '';
    document.getElementById('push-text').textContent = scan.pushContent;
  } else {
    document.getElementById('push-card').style.display = 'none';
  }
}

load();
setInterval(load, 60000); // 每分钟自动刷新
</script>
</body>
</html>
